name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-process-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with hardening flags
        run: make
      - name: Run unprivileged security tests
        run: make test-process
      - name: Build static container and VM fixtures
        run: make fixture-static guest-init

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with sanitizers
        env:
          CFLAGS: -O1 -g -std=c17 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: make
      - name: Exercise parser and process backend without seccomp
        run: ./bin/securerunner --mode process --no-seccomp --network host -- ./bin/fixture echo sanitized
